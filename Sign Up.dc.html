<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f1e4; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  a { color: #2c2e2a; text-decoration: none; border-bottom: 1px solid #80827f; }
  a:hover { border-bottom-color: #2c2e2a; }
  ::selection { background: #8ed462; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  input::placeholder { color: #a1a19f; }
  input:focus { outline: none; border-color: #8ed462; }
</style>
</helmet>

<div style="background:#f5f1e4;color:#2c2e2a;min-height:100vh;display:flex;flex-direction:column">

  <!-- NAV -->
  <div style="max-width:1200px;margin:0 auto;padding:24px 24px 0;width:100%">
    <div style="background:#ffffff;border-radius:50px;padding:10px 20px;display:flex;align-items:center;justify-content:space-between">
      <a href="FilyBase Landing.dc.html" style="display:flex;align-items:center;gap:10px;border-bottom:none">
        <img src="uploads/logoipsum-392.png" alt="FilyBase logo" style="width:36px;height:36px;border-radius:10px;display:block">
        <span style="font-size:17px;font-weight:500;color:#2c2e2a">FilyBase</span>
      </a>
      <div style="font-size:15px;color:#80827f">Already have an account? <a href="Sign In.dc.html">Sign in</a></div>
    </div>
  </div>

  <!-- FORM -->
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px">
    <div style="width:100%;max-width:420px;background:#ffffff;border-radius:50px;padding:44px 40px;opacity:0;animation:fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) forwards">
      <div style="font-size:15px;color:#80827f;margin-bottom:12px;text-align:center">$5 IN FREE CREDITS</div>
      <h1 style="font-size:36px;font-weight:500;letter-spacing:-1px;line-height:1.15;margin:0 0 32px;text-align:center">Create your account</h1>

      <div style="display:flex;flex-direction:column;gap:16px">
        <div>
          <div style="font-size:14px;font-weight:500;margin-bottom:8px">Full name</div>
          <input type="text" placeholder="Jordan Diaz" style="width:100%;background:#f5f1e4;border:1px solid #e0dbce;border-radius:10px;padding:13px 16px;font-size:15px;font-family:inherit;color:#2c2e2a">
        </div>
        <div>
          <div style="font-size:14px;font-weight:500;margin-bottom:8px">Work email</div>
          <input type="email" placeholder="you@company.com" style="width:100%;background:#f5f1e4;border:1px solid #e0dbce;border-radius:10px;padding:13px 16px;font-size:15px;font-family:inherit;color:#2c2e2a">
        </div>
        <div>
          <div style="font-size:14px;font-weight:500;margin-bottom:8px">Password</div>
          <input type="password" placeholder="At least 8 characters" style="width:100%;background:#f5f1e4;border:1px solid #e0dbce;border-radius:10px;padding:13px 16px;font-size:15px;font-family:inherit;color:#2c2e2a">
        </div>
        <a href="FilyBase Dashboard.dc.html" style="background:#2c2e2a;color:#f5f1e4;border-radius:50px;padding:15px;font-size:15px;font-weight:500;font-family:inherit;cursor:pointer;margin-top:8px;border-bottom:none;text-align:center;display:block">Create account</a>
      </div>

      <div style="display:flex;align-items:center;gap:12px;margin:28px 0">
        <div style="flex:1;height:1px;background:#e0dbce"></div>
        <div style="font-size:13px;color:#80827f">or</div>
        <div style="flex:1;height:1px;background:#e0dbce"></div>
      </div>

      <button style="width:100%;background:#f5f1e4;border:none;border-radius:50px;padding:14px;font-size:15px;font-weight:500;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px">
        Continue with GitHub
        <span style="width:8px;height:8px;border-radius:50%;background:#2ba0ff;display:inline-block"></span>
      </button>

      <p style="font-size:12px;color:#80827f;text-align:center;margin:24px 0 0;line-height:1.5">By creating an account you agree to our <a href="#" style="font-size:12px">Terms</a> and <a href="#" style="font-size:12px">Privacy Policy</a>.</p>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:800}}"></script>
</body>
</html>
