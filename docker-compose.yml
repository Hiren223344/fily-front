# ==============================================================================
# FilyBase Frontend — filybase.io
# Runs the Next.js app on :3000. Put a TLS reverse proxy (nginx/Caddy/Traefik)
# in front of it for filybase.io, and point BACKEND_ORIGIN at the gateway.
# ==============================================================================
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: filybase-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_ORIGIN=${BACKEND_ORIGIN:-https://api.filybase.io}
      - NEXT_PUBLIC_APP_NAME=FilyBase
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://filybase.io}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 3s
      retries: 3
