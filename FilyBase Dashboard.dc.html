<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f1e4; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  a { color: #2c2e2a; text-decoration: none; }
  ::selection { background: #8ed462; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .stripe-ph { background-image: repeating-linear-gradient(135deg, #e0dbce 0 10px, #f5f1e4 10px 20px); display: flex; align-items: center; justify-content: center; color: #80827f; font-family: ui-monospace, monospace; font-size: 13px; text-align: center; }
  .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace; }
</style>
</helmet>

<div style="background:#f5f1e4;color:#2c2e2a;min-height:100vh;padding-bottom:80px">

  <!-- NAV -->
  <div style="max-width:1280px;margin:0 auto;padding:24px 24px 0">
    <div style="background:#ffffff;border-radius:50px;padding:10px 10px 10px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px">
      <div style="display:flex;align-items:center;gap:10px">
        <a href="FilyBase Landing.dc.html" style="display:flex;align-items:center;gap:10px;border-bottom:none">
          <img src="uploads/logoipsum-392.png" alt="FilyBase logo" style="width:36px;height:36px;border-radius:10px;display:block">
          <span style="font-size:17px;font-weight:500;color:#2c2e2a">FilyBase</span>
        </a>
      </div>
      <div style="display:flex;gap:20px;font-size:15px;font-weight:500">
        <div style="color:#2c2e2a">Overview</div>
        <a href="Models.dc.html" style="color:#80827f;font-size:15px;font-weight:500">Models</a>
        <a href="Endpoints.dc.html" style="color:#80827f;font-size:15px;font-weight:500">Endpoints</a>
        <div style="color:#80827f">Usage</div>
        <a href="Billing.dc.html" style="color:#80827f;font-size:15px;font-weight:500">Billing</a>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:40px;height:40px;border-radius:50%;background:#2ba0ff;display:flex;align-items:center;justify-content:center;color:#ffffff;font-weight:500;font-size:14px">JD</div>
      </div>
    </div>
  </div>

  <!-- HEADER -->
  <div style="max-width:1280px;margin:40px auto 0;padding:0 24px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px">
    <div>
      <div style="font-size:15px;color:#80827f;margin-bottom:8px;opacity:0;animation:fadeUp 0.5s cubic-bezier(0.4,0,0.2,1) 0s forwards">GOOD MORNING, JORDAN</div>
      <h1 style="font-size:53px;font-weight:500;letter-spacing:-2.12px;line-height:1.1;margin:0;opacity:0;animation:fadeUp 0.5s cubic-bezier(0.4,0,0.2,1) 0.06s forwards">Overview</h1>
    </div>
    <div style="display:flex;gap:8px;background:#ffffff;border-radius:50px;padding:4px">
      <button onClick="{{ setRange24 }}" style="border:none;border-radius:50px;padding:9px 16px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;background:{{ range24Bg }};color:#2c2e2a">24h</button>
      <button onClick="{{ setRange7 }}" style="border:none;border-radius:50px;padding:9px 16px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;background:{{ range7Bg }};color:#2c2e2a">7d</button>
      <button onClick="{{ setRange30 }}" style="border:none;border-radius:50px;padding:9px 16px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;background:{{ range30Bg }};color:#2c2e2a">30d</button>
    </div>
  </div>

  <!-- STAT CARDS -->
  <div style="max-width:1280px;margin:32px auto 0;padding:0 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
    <div style="background:#ffffff;border-radius:50px;padding:28px 30px;opacity:0;animation:fadeUp 0.5s cubic-bezier(0.4,0,0.2,1) 0.1s forwards;transition:transform 250ms cubic-bezier(0.4,0,0.2,1)" style-hover="transform:translateY(-3px)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><span style="width:8px;height:8px;border-radius:50%;background:#8ed462;display:inline-block"></span><div style="font-size:14px;color:#80827f">Requests</div></div>
      <div style="font-size:36px;font-weight:500;letter-spacing:-1px">{{ stats.requests }}</div>
    </div>
    <div style="background:#ffffff;border-radius:50px;padding:28px 30px;opacity:0;animation:fadeUp 0.5s cubic-bezier(0.4,0,0.2,1) 0.16s forwards;transition:transform 250ms cubic-bezier(0.4,0,0.2,1)" style-hover="transform:translateY(-3px)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><span style="width:8px;height:8px;border-radius:50%;background:#2ba0ff;display:inline-block"></span><div style="font-size:14px;color:#80827f">Tokens processed</div></div>
      <div style="font-size:36px;font-weight:500;letter-spacing:-1px">{{ stats.tokens }}</div>
    </div>
    <div style="background:#ffffff;border-radius:50px;padding:28px 30px;opacity:0;animation:fadeUp 0.5s cubic-bezier(0.4,0,0.2,1) 0.22s forwards;transition:transform 250ms cubic-bezier(0.4,0,0.2,1)" style-hover="transform:translateY(-3px)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><span style="width:8px;height:8px;border-radius:50%;background:#ff705d;display:inline-block"></span><div style="font-size:14px;color:#80827f">Spend</div></div>
      <div style="font-size:36px;font-weight:500;letter-spacing:-1px">{{ stats.spend }}</div>
    </div>
    <div style="background:#ffffff;border-radius:50px;padding:28px 30px;opacity:0;animation:fadeUp 0.5s cubic-bezier(0.4,0,0.2,1) 0.28s forwards;transition:transform 250ms cubic-bezier(0.4,0,0.2,1)" style-hover="transform:translateY(-3px)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><span style="width:8px;height:8px;border-radius:50%;background:#f5e211;display:inline-block"></span><div style="font-size:14px;color:#80827f">P50 latency</div></div>
      <div style="font-size:36px;font-weight:500;letter-spacing:-1px">{{ stats.latency }}</div>
    </div>
  </div>

  <!-- USAGE + ENDPOINTS -->
  <div style="max-width:1280px;margin:16px auto 0;padding:0 24px;display:grid;grid-template-columns:1.6fr 1fr;gap:16px">
    <div style="background:#ffffff;border-radius:50px;padding:32px;opacity:0;animation:fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) 0.3s forwards">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
        <div style="font-size:20px;font-weight:500">Usage over time</div>
        <div style="font-size:14px;color:#80827f">tokens / hour</div>
      </div>
      <div style="height:260px;display:flex;align-items:flex-end;gap:6px;border-bottom:1px solid #e0dbce;padding-bottom:2px">
        <sc-for list="{{ chartBars }}" as="bar" hint-placeholder-count="24">
          <div style="flex:1;height:{{ bar.heightPct }}%;background:#8ed462;border-radius:6px 6px 0 0;min-height:4px;transition:height 500ms cubic-bezier(0.4,0,0.2,1) {{ bar.delay }}"></div>
        </sc-for>
      </div>
    </div>
    <div style="background:#ffffff;border-radius:50px;padding:32px;display:flex;flex-direction:column;gap:16px;opacity:0;animation:fadeUp 0.6s cubic-bezier(0.4,0,0.2,1) 0.36s forwards">
      <div style="font-size:20px;font-weight:500;margin-bottom:4px">Endpoints</div>
      <sc-for list="{{ endpoints }}" as="ep" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid #e0dbce">
          <div>
            <div style="font-size:15px;font-weight:500">{{ ep.name }}</div>
            <div style="font-size:13px;color:#80827f" class="mono">{{ ep.model }}</div>
          </div>
          <button onClick="{{ ep.toggle }}" style="display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:13px;color:#2c2e2a">
            {{ ep.statusLabel }}
            <span style="width:9px;height:9px;border-radius:50%;background:{{ ep.statusColor }};display:inline-block"></span>
          </button>
        </div>
      </sc-for>
    </div>
  </div>


</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280}}">
class Component extends DCLogic {
  state = {
    range: '24h',
    grown: false,
    endpoints: [
      { name: 'chat-prod', model: 'llama-3.1-70b', live: true },
      { name: 'embeddings', model: 'bge-large', live: true },
      { name: 'sd-image-gen', model: 'stable-diffusion-3', live: false },
      { name: 'ft-support-bot', model: 'custom fine-tune', live: true },
    ],
  };

  statsByRange = {
    '24h': { requests: '48.2K', tokens: '312M', spend: '$284', latency: '41ms' },
    '7d': { requests: '338K', tokens: '2.1B', spend: '$1,960', latency: '44ms' },
    '30d': { requests: '1.42M', tokens: '9.4B', spend: '$8,240', latency: '46ms' },
  };

  chartByRange = {
    '24h': [22, 28, 19, 34, 41, 38, 52, 61, 58, 70, 65, 74, 80, 76, 68, 72, 85, 90, 82, 77, 64, 55, 48, 40],
    '7d': [45, 52, 60, 58, 70, 66, 74],
    '30d': [40, 44, 48, 46, 52, 55, 58, 54, 60, 63, 61, 66, 70, 68, 72, 75, 71, 69, 74, 78, 80, 76, 73, 77, 82, 85, 81, 79, 84, 88],
  };

  componentDidMount() {
    requestAnimationFrame(() => this.setState({ grown: true }));
  }

  renderVals() {
    const range = this.state.range;
    const stats = this.statsByRange[range];
    const rawChart = this.chartByRange[range];
    const maxVal = Math.max(...rawChart);
    const grown = this.state.grown;
    const chartBars = rawChart.map((v, i) => ({
      heightPct: grown ? Math.round((v / maxVal) * 100) : 0,
      delay: `${i * 15}ms`,
    }));
    const endpoints = this.state.endpoints.map((ep, i) => ({
      ...ep,
      statusLabel: ep.live ? 'Live' : 'Paused',
      statusColor: ep.live ? '#8ed462' : '#ff705d',
      toggle: () => this.setState(s => {
        const next = [...s.endpoints];
        next[i] = { ...next[i], live: !next[i].live };
        return { endpoints: next };
      }),
    }));
    return {
      stats,
      chartBars,
      endpoints,
      range24Bg: range === '24h' ? '#8ed462' : 'transparent',
      range7Bg: range === '7d' ? '#8ed462' : 'transparent',
      range30Bg: range === '30d' ? '#8ed462' : 'transparent',
      setRange24: () => this.setState({ range: '24h' }),
      setRange7: () => this.setState({ range: '7d' }),
      setRange30: () => this.setState({ range: '30d' }),
    };
  }
}

</script>
</body>
</html>
